name: Godot CI

on:
  push:
    branches:
      - Dev
  pull_request:
    branches:
      - Dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Godot project
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Godot version
        run: godot --version

      - name: Run runtime validation and tests
        shell: bash
        run: |
          chmod +x scripts/*.sh
          ./scripts/ci_test.sh
