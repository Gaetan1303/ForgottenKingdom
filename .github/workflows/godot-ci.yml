name: Godot CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Godot project
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install container runtime dependencies
        shell: bash
        run: |
          set -euxo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              python3 fontconfig libfontconfig1
            rm -rf /var/lib/apt/lists/*
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache python3 fontconfig
          else
            echo "ERROR: unsupported package manager in Godot CI image" >&2
            exit 1
          fi
          command -v python3
          python3 --version

      - name: Show Godot version
        run: godot --version

      - name: Run runtime validation and tests
        shell: bash
        run: |
          chmod +x scripts/*.sh
          ./scripts/ci_test.sh
