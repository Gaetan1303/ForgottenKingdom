name: Export Web and Deploy GitHub Pages

on:
  push:
    branches:
      - Dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export-web:
    name: Export Godot Web build
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Godot environment
        shell: bash
        run: |
          echo "HOME=$HOME"
          godot --version

      - name: Validate project
        shell: bash
        run: |
          chmod +x scripts/*.sh
          ./scripts/ci_test.sh

      - name: Prepare Godot export templates
        shell: bash
        run: |
          chmod +x scripts/*.sh
          ./scripts/ensure_export_templates.sh

      - name: Export Web
        shell: bash
        run: |
          ./scripts/export_web.sh

      - name: Add .nojekyll
        run: touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy GitHub Pages
    needs: export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
