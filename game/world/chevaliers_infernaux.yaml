# ═══════════════════════════════════════════════════════════════════════
#  CHEVALIERS INFERNAUX — 12 ORDRES  (tout en français)
#  Source : Taimanin Wiki (taimanin.fandom.com) — CC-BY-SA
#  Lore canonique adapté pour le jeu RPG de gestion
# ═══════════════════════════════════════════════════════════════════════
#
#  POSITION DANS LA HIÉRARCHIE :
#  ┌─ Chancelier Bismarck
#  │   └─ Commande l'Ordre 1 directement
#  ├─ 9 Lords Nobles  ←─┐
#  └─ 12 Ordres de Chevaliers Infernaux (protègent / servent les Lords)
#     (un Chevalier Infernal peut ABATTRE une maison noble rogue)
#
#  RÈGLES DES CHEVALIERS INFERNAUX :
#  - Statut supérieur à toute noblesse démoniaque ordinaire
#  - Même un roturier devenu Chevalier Infernal surpasse un noble héréditaire
#  - Anciennement : rituel du "Chevalier Primordial" — combat contre sa propre ombre
#    (dépassement de la vanité) → aujourd'hui obsolète, remplacé par un vœu formel
#  - Ingrid est l'une des rares à avoir accompli le vrai rituel primordial
#  - Teutates était un ancien Chevalier Infernal avant de se corrompre
#  - Les Revenant Knights ≠ Chevaliers Infernaux (Revenants = wraiths du Corpse Lord)
#  - Lien symbolique avec les Dragons (les ordres portent des noms de dragons)
# ═══════════════════════════════════════════════════════════════════════

chevaliers_infernaux:

  protocole_classement: |
    L'Ordre 1 peut donner des ordres à tous les autres.
    L'Ordre 2 supervise les missions d'assassinat inter-ordres.
    Les Ordres 3-12 sont relativement indépendants — ils servent leur Lord Noble assigné.

  ordres:

    - rang: 1
      nom_fr: "Ordre des Chevaliers Sacrés Célestes"
      nom_japonais: "天聖騎士団"
      chef: "Bismarck (Chancelier)"
      lord_assigne: "Chancelier (au-dessus des 9 Lords)"
      specialite: "Commandement suprême, maintien de l'ordre dans toute la coalition"
      statut_en_2088: "Actif — Bismarck commande personnellement"
      notes: |
        Le rang 1 signifie que Bismarck peut donner des ordres à tous les autres
        Chevaliers Infernaux, quelle que soit leur appartenance.
        C'est l'ordre de réserve stratégique du Chancelier.
      effectif_estime: "Classifié"
      role_jeu: |
        Force antagoniste invisible dans les premières phases du jeu.
        Si le joueur attire trop l'attention de Bismarck, cet Ordre intervient.

    - rang: 2
      nom_fr: "Ordre du Seigneur Obscur"
      nom_japonais: "冥王騎士団"
      chef: "Ceres (vrai nom : Vasuki, Seigneure Assassine)"
      lord_assigne: "Seigneure Assassine — Famille Assassine (Maison 5)"
      specialite: "Assassinat, opérations nocturnes, surveillance des villes démoniques"
      statut_en_2088: "Actif — Ceres/Vasuki en poste"
      notes: |
        Responsable de la surveillance des Villes Sombres la nuit.
        Ses membres sont généralement des Nagas, des tueurs furtifs, et des espions d'élite.
        Ceres partage King's Rock avec Bismarck (nuit/jour).
      effectif_estime: "~500 agents (dont 80% opèrent dans l'ombre)"
      role_jeu: |
        Alliés possibles si le joueur négocie avec la Seigneure Assassine.
        Rivaux par défaut — leur réseau d'espionnage peut perturber les plans du joueur.

    - rang: 3
      nom_fr: "Ordre du Dragon Noir"
      nom_japonais: "黒竜騎士団"
      chef: "VACANT — ex-chef : Ingrid (partie rejoindre NOMAD)"
      lord_assigne: "Aucun actuellement (étaient rattachés à nulle famille en particulier)"
      specialite: "Combat frontal d'élite, force brute démonique, missions extérieures"
      statut_en_2088: |
        En désorganisation — le départ d'Ingrid a créé un vide de leadership.
        Une lutte interne existe entre membres loyaux à Ingrid et ceux prêts à servir
        un nouveau chef nommé par Bismarck.
      notes: |
        Ingrid était le chef le plus respecté. Elle a accompli le rituel primordial.
        Sa décision de rejoindre Edwin Black (NOMAD) a choqué l'Ordre.
        Certains membres la suivent en secret depuis NOMAD.
        Carmella (Ordre 4) cherche à absorber l'Ordre 3 dans son territoire.
      effectif_estime: "~300 Chevaliers Noirs actifs (réduit depuis le départ d'Ingrid)"
      role_jeu: |
        Faction recrutables pour Ingrid — certains membres peuvent rejoindre son clan
        si le joueur accomplit l'événement spécial "Retrouver les Chevaliers Noirs".
        Certains sont devenus mercenaires et peuvent être engagés.

    - rang: 4
      nom_fr: "Ordre du Dragon Blanc"
      nom_japonais: "白竜騎士団"
      chef: "Carmella"
      lord_assigne: "Famille du Sang (Blood Lord — Cara Cromwell, Maison 1)"
      specialite: "Contrôle territorial, défense des possessions vampiriques"
      statut_en_2088: "Actif — Carmella consolide son influence"
      notes: |
        Carmella est la rivale historique d'Ingrid. Elle cherche à étendre son influence
        en intégrant le territoire de l'Ordre du Dragon Noir (laissé vacant).
        Ses relations avec les Vampires de Cara Cromwell sont excellentes.
      effectif_estime: "~800 Chevaliers Blancs (les mieux équipés parmi les ordres moyens)"
      role_jeu: |
        Adversaire indirecte — Carmella et le joueur se retrouveront en opposition
        si le joueur tente de restaurer l'Ordre du Dragon Noir ou de prendre
        le territoire vampirique.
        Événement spécial : "Le Défi de Carmella" (Duel diplomatique ou combat).

    - rang: 5
      nom_fr: "Ordre du Dragon d'Or"
      nom_japonais: "金竜騎士団"
      chef: "Marika Krishna"
      lord_assigne: "Famille du Sang (Blood Lord — Cara Cromwell, Maison 1)"
      espece_chef: "Vampire"
      specialite: "Tactiques vampiriques, combat nocturne, intelligence magique"
      statut_en_2088: "Actif — entièrement dévoué aux intérêts de Cara Cromwell"
      notes: |
        Les Ordres 4 et 5 sont tous deux assignés à la Famille du Sang.
        Cette double couverture reflète la faveur que leur accorde Bismarck.
        Marika Krishna est une Vampiresse de haut rang, loyale à Cara Cromwell.
      effectif_estime: "~600 Chevaliers (majoritairement Vampires et Bêtes Sanglantes)"
      role_jeu: |
        Garde prétorienne de la Maison 1 (Famille du Sang).
        Le joueur devra les affronter ou les contourner pour conquérir cette maison.

    - rang: 6
      nom_fr: "Ordre du Dragon d'Argent"
      nom_japonais: "銀竜騎士団"
      chef: "Belzebuth"
      lord_assigne: "Famille Inconnue Β (selon configuration jeu)"
      specialite: "Contre-espionnage, défense des contre-attaques, couverture diplomatique"
      statut_en_2088: "Actif"
      notes: |
        Belzebuth est le pendant subtil du Dragon d'Or. Là où Marika Krishna force,
        Belzebuth manipule. Son identité de race n'est pas confirmée dans le wiki.
        L'Ordre est la contrepart stratégique du Dragon d'Or.
      effectif_estime: "~400 agents"
      role_jeu: |
        Forces défensives d'une des familles inconnues.
        Révélées lors des missions d'espionnage sur les Maisons 7-8.

    - rang: 7
      nom_fr: "Ordre du Dragon Bleu"
      nom_japonais: "青竜騎士団"
      chef: "Inconnu (lien possible avec le Dragon d'Azur)"
      lord_assigne: "Inconnu"
      specialite: "Inconnue — potentiellement magie de l'eau ou de l'air"
      statut_en_2088: "Présumé actif"
      notes: |
        Les détails du chef de l'Ordre du Dragon Bleu ne sont pas confirmés dans le wiki.
        Il existe un « Dragon d'Azur » mentionné dans des sources secondaires —
        potentiellement le même ordre.
      effectif_estime: "Non confirmé"
      role_jeu: |
        Forces mystérieuses. Révélées tardivement dans le jeu via espionnage avancé.

    - rang: 8
      nom_fr: "Ordre du Dragon Rouge"
      nom_japonais: "赤竜騎士団"
      chef: "Inconnu"
      lord_assigne: "Inconnu"
      specialite: "Inconnue — probablement magie du feu ou destruction"
      statut_en_2088: "Présumé actif"
      notes: |
        Contrepart du Dragon Bleu. Probablement lié aux Démons Infernaux
        ou aux Plaines Ardentes suite à la mort du Seigneur Flamme Gaap.
        Le titre de Seigneur Flamme étant vacant, l'Ordre Red Dragon est peut-être
        en quête d'un nouveau maître.
      effectif_estime: "Non confirmé"
      role_jeu: |
        Forces potentiellement sans attache — peuvent être recrutées via Or ou Mana.

    - rang: 9
      nom_fr: "Ordre du Dragon Vert"
      nom_japonais: "緑竜騎士団"
      chef: "Emma Rollo (ex-leader — a renoncé au titre)"
      lord_assigne: "Vicomté Rollo (territoire des Elfes Noirs)"
      espece_chef: "Elfe Noir"
      specialite: "Opérations forestières, magie naturelle, mobilité en terrain difficile"
      statut_en_2088: |
        Emma Rollo a abdiqué son titre de Chevalière Infernale pour se concentrer
        sur la gouvernance de la Vicomté Rollo. L'Ordre est en vacance de chef.
        Certains membres sont restés fidèles à Emma, d'autres cherchent un successeur.
      notes: |
        Premier Elfe Noir Chevalière Infernale de l'histoire — ce qui en faisait
        une figure de fierté pour la noblesse moindre des Elfes Noirs (pourtant
        discriminés dans la hiérarchie démonique).
        Son départ volontaire a été récompensé d'un territoire : la Vicomté Rollo.
      effectif_estime: "~250 Elfes Noirs et créatures sylvaines"
      role_jeu: |
        Potentiel allié si le joueur démontre du respect pour les Elfes Noirs.
        Mission spéciale : "L'Héritage de la Vicomté Rollo" → pacte avec Emma.

    - rang: 10
      nom_fr: "Ordre du Dragon Jaune (Dragon Yinglong)"
      nom_japonais: "応竜騎士団"
      chef: "Beowulf"
      lord_assigne: "Missions extérieures (hors du Monde Démoniaque)"
      espece_chef: "Non confirmée (probablement démon humanoïde de haute noblesse)"
      specialite: "Missions extérieures, exploration, contact avec le Monde Humain"
      statut_en_2088: "Actif — fréquemment hors du Monde Démoniaque"
      notes: |
        Beowulf est une amie personnelle d'Ingrid — elles sont proches
        malgré leurs affiliations différentes.
        L'Ordre du Dragon Yinglong (龍応, dragon bicorne) est spécialisé dans
        les missions au-delà du Monde Démoniaque (Monde Humain, Autre Monde).
        Beowulf est souvent en mission extérieure quand des crises éclatent.
      effectif_estime: "~150 agents d'élite (qualité > quantité)"
      role_jeu: |
        Beowulf peut apparaître comme PNJ neutre ou alliée.
        Sa relation avec Ingrid ouvre un dialogue unique.
        Mission spéciale : "Le Retour de Beowulf" → alliance possible.

    - rang: 11
      nom_fr: "Ordre du Dragon Mécanique"
      nom_japonais: "機竜騎士団"
      chef: "Arondight (Golem)"
      lord_assigne: "Seigneure Sage — Famille des Sages (Marjaana, Maison 4)"
      espece_chef: "Golem (créature artificielle)"
      specialite: "Combat mécanique, siège de forteresses, résistance physique extrême"
      statut_en_2088: |
        Sous le contrôle total de Marjaana. Arondight est son bras armé direct —
        envoyé contre toute menace que Marjaana désigne, y compris Ingrid.
      notes: |
        Arondight est un Golem d'une puissance remarquable.
        Sous domination mentale de Marjaana (Brain Flayer), il n'agit pas de lui-même.
        L'Ordre est composé de Golems et de créatures mécaniques — sans volonté propre.
        L'antidote : briser le lien de domination mentale de Marjaana.
      effectif_estime: "~80 Golems de combat + 40 auxiliaires mécaniques"
      role_jeu: |
        Force antagoniste loyale à Marjaana.
        Si le joueur brise le contrôle mental de Marjaana sur Arondight,
        l'Ordre peut être neutre ou recruté (les Golems obéissent à qui les commande).
        Mission spéciale : "Briser les Chaînes d'Arondight".

    - rang: 12
      nom_fr: "Ordre du Dragon à Neuf Têtes"
      nom_japonais: "九頭龍騎士団"
      chef: "Shesha (Naga)"
      lord_assigne: "Seigneure Assassine — Famille Assassine (Ceres/Vasuki, Maison 5)"
      espece_chef: "Naga (tribu Naga)"
      specialite: "Combat à Neuf Formes, magie venimeuse, piège et encerclement"
      statut_en_2088: "Actif — Shesha est décrite comme plus puissante qu'Arondight"
      notes: |
        Shesha est une Naga de rang légendaire — son combat à neuf formes imite
        les neuf têtes du Dragon Mythique. Elle est plus forte qu'Arondight (Ordre 11)
        malgré son rang inférieur.
        En tant que subordonnée de Vasuki (Ceres), elle est un atout clé
        pour la Famille Assassine.
      effectif_estime: "~120 Nagas d'élite (rang 12 mais puissance effective très haute)"
      role_jeu: |
        Si le joueur s'allie avec Ceres/Vasuki, Shesha devient une alliée puissante.
        Combat optionnel : "Le Défi de Shesha" — épreuve de courage pour prouver
        la valeur du clan du joueur aux yeux des Nagas.

# ─────────────────────────────────────────────────────────────────────
#  INGRID — SON RÔLE DANS LES CHEVALIERS INFERNAUX
# ─────────────────────────────────────────────────────────────────────
ingrid_et_les_chevaliers:
  ancien_rang: 3
  ancien_ordre: "Ordre du Dragon Noir"
  titre: "Chef de l'Ordre du Dragon Noir (ancien)"
  rituel_accompli: true
  rituel_type: "Chevalier Primordial (rituel de l'ombre — combat contre soi-même, obsolète)"
  statut_actuel: "Hors service — NOMAD, Palace des Ténèbres, Yomihara"
  raison_depart: |
    Double motivation :
    1. Désaccord idéologique avec la politique de Bismarck (statu quo perpétuel)
    2. Amour pour Edwin Black — fondateur de NOMAD
  impact_sur_ordre: |
    Son départ a déstabilisé l'Ordre du Dragon Noir.
    Carmella (Ordre 4) cherche à combler le vide.
    Beowulf (Ordre 10) reste neutre mais solidaire d'Ingrid personnellement.
  role_dans_jeu: |
    Le joueur peut restaurer l'Ordre du Dragon Noir comme base de son clan.
    Mission principale : "La Flamme Noire" → reconstituer l'Ordre autour d'Ingrid.
    Cela débloquerait des recrutements spéciaux parmi les anciens membres de l'Ordre 3.

